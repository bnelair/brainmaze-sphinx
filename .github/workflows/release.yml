name: Release (reusable)

# Reusable release workflow shared across the BrainMaze package family.
#
# pyproject.toml is the single source of truth for the version (static [project].version).
# This workflow NEVER writes to a protected branch, and it does NOT publish to PyPI itself:
# PyPI Trusted Publishing does not support publishing from a reusable workflow, so the
# publish step must run in the caller's own top-level workflow. Here we only:
#   1. decide whether to release (the version on main has no tag yet),
#   2. run the test suite,
#   3. build the sdist + wheel and upload them as the `dist` artifact,
#   4. check that artifact's contents (check-dist.yml: only the package, no tests/demos/
#      docs/data; `dist-check: error` makes a violation block the release).
# The caller then downloads that artifact, publishes to PyPI (Trusted Publishing, matched
# against the caller repo), and tags + creates the GitHub Release after a successful upload.
#
# Callers reference it as:
#   uses: bnelair/brainmaze-sphinx/.github/workflows/release.yml@main

on:
  workflow_call:
    inputs:
      bump:
        description: "Deprecated and ignored -- the version is bumped by the Prepare release PR. Only this input is still accepted; callers must use the current caller set (see RELEASING.md)."
        type: string
        required: false
        default: ""
      python-version:
        type: string
        default: "3.10"
      versions:
        description: "Passed to test.yml (JSON list of python/numpy combinations); empty = python-version only."
        type: string
        default: ""
      dist-check:
        description: "Artifact-content check of the built wheel + sdist (check-dist.yml), run on the exact `dist` artifact before it is handed to the caller's publish job: 'error' = fail on tests/demos/docs/data or files outside the package, 'warn' = annotate only (default), 'off' = skip."
        type: string
        default: "warn"
      allowed-assets:
        description: "Whitespace-separated globs of runtime data files the package needs, exempt from the data-file rule, e.g. 'brainmaze_torch/seizure_detection/_models/*.pt'."
        type: string
        default: ""
      dist-packages:
        description: "Whitespace-separated top-level packages allowed in the artifacts; empty = derived from the distribution name."
        type: string
        default: ""
    outputs:
      released:
        description: "'true' when the current version has no tag yet and a release should be published."
        value: ${{ jobs.guard.outputs.release }}
      version:
        description: "The version read from pyproject.toml."
        value: ${{ jobs.guard.outputs.version }}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Only release when the current pyproject version has no tag yet.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      # Credentials stay persisted (read-only token): `git ls-remote` needs them on private repos.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # tomllib
      - name: Decide whether to release
        id: check
        shell: bash
        run: |
          set -euo pipefail
          # [project].version only (not any other `version =` key), and it must be X.Y.Z:
          # it ends up in a tag name and in the publish job's shell.
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::[project].version '${version}' is not X.Y.Z; refusing to release."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # git ls-remote --exit-code: 0 = ref found, 2 = no matching ref, other = real error.
          # Distinguish them so a transient network/auth failure never looks like "no tag".
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${version} already exists -- nothing to release."
          elif [ "$rc" -eq 2 ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Version v${version} has no tag -- will release."
          else
            echo "::error::git ls-remote failed (exit ${rc}); aborting to avoid an accidental release."
            exit "$rc"
          fi

  test:
    needs: guard
    if: needs.guard.outputs.release == 'true'
    uses: bnelair/brainmaze-sphinx/.github/workflows/test.yml@main
    with:
      python-version: ${{ inputs.python-version }}
      versions: ${{ inputs.versions }}
      # The artifact check runs below on the real `dist` artifact, not on a rebuild.
      dist-check: "off"

  build:
    needs: [guard, test]
    if: needs.guard.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The caller's publish job needs this whole workflow, so with `dist-check: error` an
  # unwanted file in the artifact blocks the release.
  check-dist:
    needs: [guard, build]
    if: needs.guard.outputs.release == 'true' && inputs.dist-check != 'off'
    uses: bnelair/brainmaze-sphinx/.github/workflows/check-dist.yml@main
    with:
      artifact: dist
      dist-check: ${{ inputs.dist-check }}
      allowed-assets: ${{ inputs.allowed-assets }}
      dist-packages: ${{ inputs.dist-packages }}
