name: Test (reusable)

# Reusable test workflow shared across the BrainMaze package family.
# Callers reference it as:
#   uses: bnelair/brainmaze-sphinx/.github/workflows/test.yml@main
# It runs the package's own test suite on one job per OS x version combination.
#
# `versions` (optional) is a JSON list of {"python": "...", "numpy": "..."} combinations;
# "numpy" is a pip version specifier appended to "numpy" (e.g. "<2", ">=2", "" = latest).
# The family default is to test the oldest supported stack and the newest one:
#   versions: '[{"python": "3.10", "numpy": "<2"}, {"python": "3.12", "numpy": ">=2"}]'
# Without `versions`, a single combination (python-version, latest numpy) is used, which
# keeps older callers working unchanged.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version used on all OSes."
        type: string
        default: "3.10"
      versions:
        description: 'JSON list of {"python": "3.x", "numpy": "<pip specifier or empty>"} combinations.'
        type: string
        default: ""
      package-import-name:
        description: "Importable package name, e.g. brainmaze_utils (used only to print the installed version)."
        type: string
        default: ""

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        v: ${{ fromJSON(inputs.versions || format('[{{"python":"{0}","numpy":""}}]', inputs.python-version)) }}
    name: test (${{ matrix.os }}, py${{ matrix.v.python }}, numpy${{ matrix.v.numpy || ' latest' }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.v.python }}

      - name: Install package with test extra
        shell: bash
        env:
          NUMPY_SPEC: ${{ matrix.v.numpy }}
        run: |
          python -m pip install --upgrade pip
          pip install build
          if [ -n "$NUMPY_SPEC" ]; then
            # resolve the package and the numpy constraint together
            pip install -e '.[test]' "numpy${NUMPY_SPEC}"
          else
            pip install -e '.[test]'
          fi
          python -c "import numpy, scipy; print('numpy', numpy.__version__, '| scipy', scipy.__version__)"

      - name: Print installed version
        if: ${{ inputs.package-import-name != '' }}
        run: python -c "import ${{ inputs.package-import-name }} as p; print(p.__name__, p.__version__)"

      - name: Run tests
        run: python -m pytest
