name: Test (reusable)

# Reusable test workflow shared across the BrainMaze package family.
# Callers reference it as:
#   uses: bnelair/brainmaze-sphinx/.github/workflows/test.yml@main
# It runs the package's own test suite on one job per OS x version combination.
#
# `versions` (optional) is a non-empty JSON list of {"python": "...", "numpy": "..."}
# combinations, with both values as JSON *strings* ("3.10", not 3.10 -> "3.1"). "numpy" is
# a pip specifier appended to "numpy" ("<2", ">=2", "" = latest); a missing "python" falls
# back to python-version. numpy<2 has no wheels for Python >= 3.13, so pair it with <= 3.12
# (numpy is installed binary-only, so an impossible pair fails fast instead of compiling).
# The family default is to test the oldest supported stack and the newest one:
#   versions: '[{"python": "3.10", "numpy": "<2"}, {"python": "3.12", "numpy": ">=2"}]'
# Without `versions`, a single combination (python-version, latest numpy) is used, which
# keeps older callers working unchanged.
#
# The `dist-contents` job builds the wheel + sdist from the checkout and checks that they
# contain only the package (check-dist.yml; inputs dist-check, allowed-assets,
# dist-packages), so a packaging regression fails on the PR, before any release. The tests
# themselves always run from the repository checkout (editable install), so excluding the
# test suite from the artifacts does not affect them.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version used on all OSes."
        type: string
        default: "3.10"
      versions:
        description: 'JSON list of {"python": "3.x", "numpy": "<pip specifier or empty>"} combinations.'
        type: string
        default: ""
      package-import-name:
        description: "Importable package name, e.g. brainmaze_utils (used only to print the installed version)."
        type: string
        default: ""
      dist-check:
        description: "Artifact-content check of the built wheel + sdist (check-dist.yml): 'error' = fail on tests/demos/docs/data or files outside the package, 'warn' = annotate only (default), 'off' = skip."
        type: string
        default: "warn"
      allowed-assets:
        description: "Whitespace-separated globs (relative to the artifact root, matched per path segment; '**' = any depth) of non-code files the package may ship, e.g. 'brainmaze_torch/seizure_detection/_models/*.pt'."
        type: string
        default: ""
      required-assets:
        description: "Whitespace-separated globs that must each match at least one file in the wheel AND the sdist (allowed too); a missing one fails even in 'warn' mode."
        type: string
        default: ""
      dist-packages:
        description: "Whitespace-separated top-level packages allowed in the artifacts; empty = derived from the distribution name."
        type: string
        default: ""

# Test jobs never need write access, even when called from a release workflow that has it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        v: ${{ fromJSON(inputs.versions || format('[{{"python":"{0}","numpy":""}}]', inputs.python-version)) }}
    # Without `versions`, keep the historical check names ("test (ubuntu-latest)").
    name: ${{ inputs.versions && format('test ({0}, py{1}, numpy{2})', matrix.os, matrix.v.python || inputs.python-version, matrix.v.numpy || ' latest') || format('test ({0})', matrix.os) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.v.python || inputs.python-version }}

      - name: Install package with test extra
        shell: bash
        env:
          NUMPY_SPEC: ${{ matrix.v.numpy }}
        run: |
          python -m pip install --upgrade pip
          pip install build
          if [ -n "$NUMPY_SPEC" ]; then
            # resolve the package and the numpy constraint together; never build numpy
            pip install --only-binary=numpy -e '.[test]' "numpy${NUMPY_SPEC}"
          else
            pip install -e '.[test]'
          fi
          # Log the resolved environment (the numpy constraint can move other deps too).
          # Not every package depends on numpy/scipy, so don't import them.
          python - <<'PY'
          import importlib.metadata as md
          for d in ("numpy", "scipy", "pandas", "torch"):
              try:
                  print(f"{d} {md.version(d)}")
              except md.PackageNotFoundError:
                  print(f"{d} not installed")
          PY
          pip list

      - name: Print installed version
        if: ${{ inputs.package-import-name != '' }}
        env:
          PKG: ${{ inputs.package-import-name }}
        run: python -c "import importlib, os; p = importlib.import_module(os.environ['PKG']); print(p.__name__, p.__version__)"

      - name: Run tests
        run: python -m pytest

  dist-contents:
    if: inputs.dist-check != 'off'
    uses: bnelair/brainmaze-sphinx/.github/workflows/check-dist.yml@main
    with:
      dist-check: ${{ inputs.dist-check }}
      python-version: ${{ inputs.python-version }}
      allowed-assets: ${{ inputs.allowed-assets }}
      required-assets: ${{ inputs.required-assets }}
      dist-packages: ${{ inputs.dist-packages }}
